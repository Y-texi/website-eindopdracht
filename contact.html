<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Hotsneakss</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>


    <header class="navbar">
         <div class="logo">
            <img src="afbeeldingen/nXSaH.jpg" alt="Logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
           
        </nav>
    </header>

    <section class="contact">
        <div class="container">
            <h1>Contact us</h1>
            <p class="intro">
                Heb je vragen over onze schoenen of je bestelling? Neem gerust contact met ons op.
            </p>

            <div class="contact-info">
                <div class="info-box">
                    <h3>E-mail</h3>
                    <p>info@HotSneaksss.nl</p>
                </div>

                <div class="info-box">
                    <h3>Telefoon</h3>
                    <p>+31 6 12345678</p>
                </div>

                <div class="info-box">
                    <h3>Adres</h3>
                    <p>Breedijk 12<br>1234 AB Woerden<br>Nederland</p>
                </div>

            
            </div>

            <div class="socials">
                <h3>Volg ons</h3>
                <a href="https://www.instagram.com/">Instagram</a>
                <a href="https://www.snapchat.com/">Snapchat</a>
                <a href="https://www.tiktok.com/">TikTok</a>
            </div>

          


            <form class="contact-form">
                <h3>Stuur een bericht</h3>

                <input type="text" placeholder="Naam" required>
                <input type="email" placeholder="E-mail" required>
                <textarea placeholder="Je bericht..." required></textarea>

                <button type="submit">Versturen</button>
            </form>
        </div>
    </section>

</body>
</html>
